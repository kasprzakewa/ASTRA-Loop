[project]
name = "astra-loop"
version = "0.1.0"
requires-python = ">=3.10"
description = ""

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["core", "gui", "scripts", "main.py"]
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = [
    "E",   
    "W",   
    "F",   
    "I",   
    "UP",  
    "B",   
    "SIM", 
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["core", "gui"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

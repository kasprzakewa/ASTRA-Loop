# PD calibration test scenarios (YAML v1)
#
# Paths in `flights[].csv` are relative to this file.
# See data/calibration/README.md for workflow and data/calibration/SCENARIOS_YAML.md for YAML scripting.

version: 1

defaults:
  mission_target_apogee_m: 2200.0
  tuning_target_apogee_m: 2200.0
  filter: NoFilter
  predictor: ApogeePredict3D
  controller: PDController
  coast_solver: euler
  pd:
    kp: 0.08
    kd: 0.0005
    error_deadband: 10.0
    max_deploy_speed: 200.0
  monte_carlo:
    bounds_preset: monte_carlo
    seeds: 20

# Reusable Coast SIL presets (plant-only disturbances)
sil_presets:
  nominal:
    wind_speed: 0.0
    gust_strength: 0.0
    plant_mass_scale: 1.0
    plant_cd_scale: 1.0
  wind_6ms:
    wind_speed: 6.0
    gust_strength: 0.0
    plant_mass_scale: 1.0
    plant_cd_scale: 1.0
  gust_2ms:
    wind_speed: 0.0
    gust_strength: 2.0
    plant_mass_scale: 1.0
    plant_cd_scale: 1.0
  mass_p3pct:
    wind_speed: 0.0
    gust_strength: 0.0
    plant_mass_scale: 1.03
    plant_cd_scale: 1.0
  cd_p8pct:
    wind_speed: 0.0
    gust_strength: 0.0
    plant_mass_scale: 1.0
    plant_cd_scale: 1.08

# Ranges for scripts/tune_pd.py Monte Carlo sampling
sil_bounds:
  monte_carlo:
    wind_speed: [0.0, 6.0]
    gust_strength: [0.0, 2.0]
    plant_mass_scale: [0.97, 1.03]
    plant_cd_scale: [0.92, 1.08]

# OpenRocket booster trajectories (convert with scripts/convert_openrocket_csv.py)
flights:
  - name: astra_nominal
    csv: ../converted/astra_3d.csv
    description: ASTRA Simulation 4, nominal conditions (~2497 m OR apogee)
  - name: or_nominal
    csv: ../converted/or_3d.csv
    description: OpenRocket Simulation 13 baseline

# Named test cases = flight + SIL preset
test_cases:
  - name: astra_nominal
    flight: astra_nominal
    sil: nominal
    description: Baseline ASTRA boost, ideal coast plant
  - name: astra_wind_6ms
    flight: astra_nominal
    sil: wind_6ms
    description: ASTRA boost, 6 m/s horizontal wind on plant
  - name: astra_gust_2ms
    flight: astra_nominal
    sil: gust_2ms
    description: ASTRA boost, vertical gust on plant
  - name: astra_mass_p3pct
    flight: astra_nominal
    sil: mass_p3pct
    description: ASTRA boost, plant 3% heavier than model
  - name: astra_cd_p8pct
    flight: astra_nominal
    sil: cd_p8pct
    description: ASTRA boost, plant 8% more drag than model

# Suites group test cases for GUI batch runs and validate_pd.py
suites:
  validation:
    description: Pre-firmware check on available flights and SIL corners
    cases:
      - astra_nominal
      - astra_wind_6ms
      - astra_gust_2ms
      - astra_mass_p3pct
      - astra_cd_p8pct
  nominal_only:
    description: Quick smoke — single ideal case per flight
    cases:
      - astra_nominal
